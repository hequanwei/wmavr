<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>显卡编码器 · WMAVR</title>
  <meta name="description" content="查桌面显卡能不能硬件编码 AV1、HEVC 和 H.264。">
  <link rel="canonical" href="https://wmavr.com/gpu/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="brand">
        <a class="logo-link" href="/" aria-label="wmavr"><img src="/img/wordmark.svg" alt=""></a>
        <nav class="nav" aria-label="栏目">
          <a href="/">首页</a>
          <a href="/rig/">串流诊断</a>
          <a href="/hardware/">硬件</a>
          <a href="/directory/">目录</a>
        </nav>
      </div>
      <h1>显卡编码器</h1>
      <p class="lede">查这张桌面卡能不能硬件编码 AV1、HEVC 和 H.264。要连头显和网络一起看，用串流诊断。</p>
    </header>
    <div class="layout">
      <section class="steps">
        <div class="step">
          <label class="field" for="gpu">显卡型号</label>
          <select id="gpu"><option value="">选择型号</option></select>
          <p id="gpu-hint" class="hint"></p>
          <button type="button" id="use-detected" hidden>换成识别到的型号</button>
        </div>
      </section>
      <aside class="result-card">
        <div id="result" class="result"><h2>请选择显卡</h2></div>
        <p class="fine"><a href="/rig/">去看串流诊断</a></p>
      </aside>
    </div>
  </div>
  <script src="../js/catalog.js"></script>
  <script src="../js/gpu.js"></script>
</body>
</html>
