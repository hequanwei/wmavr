<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wmavr</title>
  <meta name="description" content="查这套 PCVR 怎么串，并浏览串流、WebXR、可视化和三维资产目录。">
  <link rel="canonical" href="https://wmavr.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="brand">
        <a href="/">wmavr</a>
        <nav class="nav" aria-label="栏目">
          <a href="/" aria-current="page">首页</a>
          <a href="/rig/">串流诊断</a>
          <a href="/hardware/">硬件</a>
          <a href="/directory/">目录</a>
        </nav>
      </div>
      <h1>wmavr</h1>
      <p class="lede">看这套显卡和头显怎么串，也可以按用途找工具。</p>
    </header>
    <div class="cards">
      <a class="card" href="/rig/">
        <strong>串流诊断</strong>
        <span>选显卡、头显、Wi-Fi 和场景，看卡在哪，该用哪种编码和码率。</span>
      </a>
      <a class="card" href="/hardware/">
        <strong>硬件</strong>
        <span>同一套规则下的快速判断，外加四台头显和各代显卡能不能处理 AV1。</span>
      </a>
      <a class="card" href="/directory/">
        <strong>工具目录</strong>
        <span>串流、WebXR、空间视频、建筑可视化和三维资产。按标签筛选。</span>
      </a>
      <a class="card" href="/table/">
        <strong>能力表</strong>
        <span>诊断用的整张数字表和出处。</span>
      </a>
    </div>
    <p class="fine">按 90Hz 和头显默认分辨率估算。码率来自 Virtual Desktop 的公开上限，网络按经验值。不测当前网速，也不预测某一款游戏的帧率。</p>
  </div>
</body>
</html>
